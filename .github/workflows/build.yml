name: Build ID3-TagIT

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: windows-2022

    steps:
      # Full history and tags, so the release notes can list the commits since the last release.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install NuGet
        uses: NuGet/setup-nuget@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: nuget restore ID3-TagIT.sln

      - name: Build Release x86
        run: >
          msbuild ID3-TagIT.sln
          /p:Configuration=Release
          /p:Platform=x86
          /m

      - name: Run unit tests
        run: packages\xunit.runner.console.2.9.3\tools\net48\xunit.console.x86.exe ID3-TagIT.Tests\bin\Release\ID3-TagIT.Tests.dll

      # The bare build, for a quick look; releases carry only the installer and the portable zip.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ID3-TagIT-build
          path: bin/Release

      # Releases are versioned 3.5.0 for a final build. An alpha or beta (IS_ALPHA/IS_BETA in
      # Main.cs) is built many times, so it also carries the workflow's run number, which only goes
      # up: 3.5.0-beta.48. The tag is v<version>, a semantic version; the packages are
      # ID3-TagIT-<version>-Setup.exe and -Portable.zip.
      - name: Package portable edition and installer
        shell: pwsh
        run: |
          $version = ((Get-Item bin\Release\ID3-TagIT.exe).VersionInfo.FileVersion -split '\.')[0..2] -join '.'
          $main = Get-Content ID3_TagIT\Main.cs -Raw
          $label = if ($main -match 'IS_ALPHA = true') { 'alpha' } elseif ($main -match 'IS_BETA = true') { 'beta' } else { '' }
          $name = if ($label) { "$version-$label.$env:GITHUB_RUN_NUMBER" } else { $version }
          "TAG=v$name", "PACKAGE=ID3-TagIT-$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Portable.txt next to the exe keeps settings and temp files in the extracted folder.
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item -Recurse bin\Release\* portable
          Copy-Item installer\Portable.txt portable
          Compress-Archive -Path portable\* -DestinationPath "ID3-TagIT-$name-Portable.zip"

          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DSuffix=$name" "/DSourceDir=$pwd\bin\Release" installer\ID3-TagIT.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "installer\Output\ID3-TagIT-$name-Setup.exe" .

      # Drives the portable edition from the zip on the runner's desktop; a failure stops the release.
      - name: Run smoke tests
        shell: pwsh
        run: |
          Expand-Archive "$env:PACKAGE-Portable.zip" smoke-app
          $env:ID3TAGIT_SMOKE_APP = "$pwd\smoke-app"
          packages\xunit.runner.console.2.9.3\tools\net48\xunit.console.x86.exe ID3-TagIT.SmokeTests\bin\Release\ID3-TagIT.SmokeTests.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The release's title is the package name. The notes list every commit since the previous
      # release. Re-running a workflow run keeps its run number, so it replaces the files on the
      # release it already made.
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = "$env:PACKAGE-Setup.exe", "$env:PACKAGE-Portable.zip"
          gh release view $env:TAG *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          }
          else {
            # Newest first by creation date; GitHub's own list order isn't reliable for this.
            $previous = (gh release list --limit 50 --json tagName,createdAt | ConvertFrom-Json) | Sort-Object createdAt -Descending | Select-Object -First 1 -ExpandProperty tagName
            # Name the tag fully; the older releases' tags are short SHAs, which git can't tell
            # from the commits they abbreviate.
            $range = if ($previous) { "refs/tags/$previous..$env:GITHUB_SHA" } else { $env:GITHUB_SHA }
            git log --reverse --format='* %s' $range | Out-File -FilePath notes.md -Encoding utf8

            gh release create $env:TAG @files --title $env:PACKAGE --target $env:GITHUB_SHA --notes-file notes.md --latest
          }

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
